<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tea House</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <!-- font aswons css -->
    <script src="https://kit.fontawesome.com/bbfc4be646.js" crossorigin="anonymous"></script>
    <!-- talween css  -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .manrope {
            font-family: "Manrope", sans-serif;
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        clifford: '#da373d',
                    }
                }
            }
        }
    </script>
</head>

<body class="manrope">

    <main class="max-w-7xl mx-auto px-8 lg:px-28">
        <!-- Header section -->
        <header class="flex pt-10 pb-20">
            <!-- Text content -->
            <div>
                <h1 class="text-5xl font-semibold">It's good <br> tea time at The <br> Tea House</h1>
                <p class="text-[#777777]">Tea and Botanical Solutions Supplier Give Optimum <br> Satisfaction To Your
                    Taste Buds.</p>
                <button
                    class="bg-gradient-to-r from-orange-500 to-red-500 px-5 py-3 rounded-xl text-white font-bold">Explore
                    More <i class="fa-solid fa-arrow-right -rotate-45 text-xl"></i></button>
            </div>
            <!-- img content -->
            <div class="relative">
                <!-- Image content -->
                <div>
                    <img class="w-full" src="images/banner.png" alt="">
                </div>
                <!-- Image text content -->
                <div>
                    <!-- card -->
                    <div class="flex absolute items-center  bg-white shadow-xl px-2 py-2 md:px-10 md:py-10 lg:px-5 lg:py-4 rounded-xl top-20 md:top-3/4 md:left-48">
                        <!-- icon -->
                       <div>
                         <i class="fa-solid fa-star text-2xl text-amber-400"></i>
                       </div>
                        <!-- text -->
                        <div class="ml-3">
                            <h2 class="lg:text-2xl font-bold">5.00</h2>
                            <p class="text-[#777777]">Trust Pilot Ratings</p>
                        </div>

                    </div>
                </div>
            </div>
        </header>
    </main>

</body>

</html>
